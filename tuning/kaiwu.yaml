# kaiwu 的调优表
#
# 中文意图 → 本库路径片段（检索时做 path LIKE %片段%）。
# 前半部分来自原全局硬编码表，按本库实际内容过滤（片段匹配不到任何路径的丢弃）；
# 后半部分是本库自己的映射。两者都是「声明」，不再有全局表。
# 片段要够短才能同时匹配到目录名与文件名（如 api 命中 ApiController.php）。
intent_map:
  配置:
  - config
  文档:
  - docs
  脚本:
  - scripts
  应用:
  - app
  代码:
  - app
  知识库:
  - kb
roles:
  README.md: index
  kb/kaiwu/*: guide
