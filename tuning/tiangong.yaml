# tiangong 的调优表
#
# 中文意图 → 本库路径片段（检索时做 path LIKE %片段%）。
# 前半部分来自原全局硬编码表，按本库实际内容过滤（片段匹配不到任何路径的丢弃）；
# 后半部分是本库自己的映射。两者都是「声明」，不再有全局表。
# 片段要够短才能同时匹配到目录名与文件名（如 api 命中 ApiController.php）。
intent_map:
  路由:
  - routes/
  中间件:
  - middleware
  配置:
  - config
  状态管理:
  - src/renderer/store
  - store
  存储:
  - store
  持久化:
  - Repository
  - store
  仓库:
  - Repository
  - repo
  鉴权:
  - Auth
  - Middleware
  权限:
  - Auth
  - Middleware
  组件:
  - src/renderer/components
  服务:
  - Service
  文档:
  - docs
  脚本:
  - scripts
  工具:
  - utils
  - helpers
  样式:
  - index.css
  前端:
  - src/renderer
  页面:
  - src/renderer/panels
  - src/renderer/canvas
  渲染进程:
  - src/renderer
  主进程:
  - src/main
  预加载:
  - src/preload
  共享:
  - src/shared
  测试:
  - tests
  示例:
  - examples
  原型:
  - spikes
roles:
  README.md: index
  docs/*: guide
