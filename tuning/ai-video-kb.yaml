# ai-video-kb 的调优表（知识源接入契约的用户自定义层）
#
# 三节：
#   aliases     canonical term → 别名列表。只有正文里真实出现过的术语才写进来
#               （契约规则 R-06 会校验）。别名是用户可能的问法或英文写法。
#   intent_map  中文意图 → 本库路径。检索器用它做路径提示，替代全局硬编码表。
#   roles       路径通配 → 文档角色（index / entry / faq / reference / guide）
aliases:
  ComfyUI: [comfy, comfyui, Comfy UI]
  SDXL: [sdxl, SD XL]
  Flux: [flux]
  ControlNet: [controlnet, control net]
  IP-Adapter: [ipadapter, ip adapter, IP适配器]
  LoRA: [lora, 低秩适配, 轻量微调]
  TTS: [tts, 文字转语音, 语音合成]
  Live2D: [live2d, live 2d]
  FaceID: [faceid, face id, 人脸身份保持]
  InstantID: [instantid, instant id]
  PuLID: [pulid, pu lid]
  漫剧: [漫剧, 短剧动画, AI短剧]
  推理: [推理, inference, 采样]
  采样器: [采样器, sampler]
  工作流: [工作流, workflow]

intent_map:
  部署: ["09-部署与生态"]
  硬件: ["09-部署与生态"]
  生态: ["09-部署与生态"]
