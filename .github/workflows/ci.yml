name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: 知识源接入契约门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 契约校验只依赖 YAML 解析，不需要模型与向量库
      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install pyyaml

      - name: 校验 dev-kb 自身满足契约
        run: DEV_KB_PYTHON=python sh scripts/contract_check.sh --config projects.ci.yaml

  tests:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只装解析与切块所需的依赖；完整评测需要本地模型与向量库，不在 CI 里收集。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml markdown-it-py \
            tree-sitter tree-sitter-php tree-sitter-python \
            tree-sitter-rust tree-sitter-typescript

      - name: 跑测试
        run: |
          PYTHONPATH=src python -m pytest \
            tests/test_unit.py \
            tests/test_integration.py \
            tests/test_mcp_server.py \
            tests/test_contract_rules.py \
            tests/test_contract_declaration.py \
            tests/test_contract_service.py \
            tests/test_contract_mcp.py \
            -q

  kb-spec-consistency:
    name: kb-spec 双实现一致性（fixture 比对）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 实现 = fixtures/kb-spec/frozen_check_kb.py（kaiwu 仓库无远端，
      # 冻结副本与 kaiwu-snapshot 同进退）；Rust 实现 = rm 的 synapse CLI。
      - name: Checkout repository-manage
        uses: actions/checkout@v4
        with:
          repository: zmc576700954/repository-manage
          ref: main
          path: repository-manage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 synapse CLI
        working-directory: repository-manage/src-tauri
        # CLI 只依赖 validator（tauri-free）：--no-default-features 跳过
        # tauri/glib 等桌面依赖，ubuntu runner 无需装 webkit/glib 系统包。
        run: cargo build --no-default-features --bin synapse

      - name: fixture 比对（判据等价 + 黄金基线）
        run: |
          python3 fixtures/kb-spec/compare.py \
            --rm-repo repository-manage
